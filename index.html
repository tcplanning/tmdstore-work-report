<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>TMDstore 施工管理 Ver.5（社内記録）</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif;color:#172333;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}.wrap{max-width:640px;margin:auto;padding:16px 16px 95px}header{background:#102c46;color:white;padding:20px 16px}header h1{margin:0;font-size:21px}header small{color:#c8d8e6}.progress{display:flex;gap:5px;margin:16px 0}.progress span{height:6px;background:#dce5ee;flex:1;border-radius:5px}.progress .on{background:#137bb9}.panel{background:white;border-radius:16px;padding:20px;margin:12px 0;box-shadow:0 2px 9px #1723330b}h2{font-size:20px;margin:0 0 16px}label{display:block;font-size:14px;font-weight:700;margin:14px 0 5px}input,select,textarea{width:100%;font-size:17px;padding:12px;border:1px solid #b9c9d5;border-radius:9px;background:white}textarea{min-height:92px}.buttons{position:fixed;bottom:0;left:0;right:0;background:#fff;padding:12px;display:flex;gap:10px;box-shadow:0 -3px 16px #102c4622;justify-content:center}.buttons button{max-width:300px}button{border:0;border-radius:10px;padding:14px;font-size:16px;font-weight:700;background:#087ab9;color:white;cursor:pointer;flex:1}button.secondary{background:#e8eff5;color:#21455d}.hint{font-size:13px;color:#62778a}.task{padding:12px 0;border-bottom:1px solid #e4edf3}.task label{margin:0 0 8px}.task select{font-size:15px}.hide{display:none}.pill{display:inline-block;padding:5px 9px;border-radius:20px;background:#e8f3f9;color:#135b82;font-size:12px}.photo{padding:10px;border:1px dashed #aec2d1;border-radius:10px;margin:12px 0}.preview img{width:80px;height:80px;object-fit:cover;border-radius:8px;margin:4px}.car{border:1px solid #b9c9d5;border-radius:12px;width:100%;height:230px;touch-action:none;background:#f9fbfd}.warn{background:#fff7e7;border-radius:8px;padding:10px;font-size:13px;color:#705520}pre{white-space:pre-wrap;font-family:inherit;font-size:13px;line-height:1.7;background:#f3f6fa;padding:14px;border-radius:9px}a{color:#087ab9}@media print{header,.progress,.buttons,.warn,#exportText,#exportJSON,#printPDF{display:none!important}.wrap{padding:0;max-width:none}.panel{box-shadow:none;padding:0}pre{font-size:11px;white-space:pre-wrap;overflow-wrap:anywhere}} #reportPaper{display:none}@media print{@page{size:A4;margin:12mm}body{background:white!important}header,main,.buttons{display:none!important}#reportPaper{display:block!important;color:#182738;font-size:10pt;line-height:1.45}.report-title{font-size:18pt;font-weight:800;border-bottom:3px solid #193a55;padding-bottom:8px;margin-bottom:12px}.report-meta{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;margin:12px 0}.report-meta div{border-bottom:1px solid #ccd6de;padding:5px 0}.report-section{break-after:avoid;font-weight:700;background:#e9eff4;padding:6px 8px;margin:16px 0 6px}.report-table{width:100%;border-collapse:collapse;table-layout:fixed}.report-table th,.report-table td{border:1px solid #c6d1d9;padding:3px 5px;font-size:8.5pt;overflow-wrap:anywhere}.report-table th{background:#f2f6f9;text-align:left}.report-notes{border:1px solid #c6d1d9;min-height:65px;padding:8px;white-space:pre-wrap;overflow-wrap:anywhere}.report-footer{margin-top:14px;color:#5c6975;font-size:8pt}#reportPaper{break-inside:avoid}} </style></head><body><header><div style="max-width:640px;margin:auto"><h1>TMDstore 施工管理</h1><small>正式版開発 第2工程｜社内施工記録</small></div></header><main class="wrap"><div class="progress" id="progress"></div><section class="panel" id="screen"></section><div class="warn">開発・検証版です。実名・電話番号・ナンバーなどの個人情報は入力しないでください。写真は画面上のみで、PDF・JSON・Google Driveには保存されません。</div></main><article id="reportPaper" aria-label="印刷用作業報告書"></article><nav class="buttons"><button class="secondary" id="prev">戻る</button><button id="next">次へ</button></nav><script>
const wash=['車両状態・保管状況確認','ホイール・タイヤ洗浄','細部洗浄A（ドア回り）','アルカリプレウォッシュ','細部洗浄B（パネル継ぎ目）','アルカリ後すすぎ','酸性プレウォッシュ','酸性後すすぎ','中性シャンプー・コンタクトウォッシュ','純水すすぎ・仕上げ','拭き上げ・最終確認'];
const interior=['車内掃除機','車内水拭き・クリーナー','車内乾拭き・乾燥確認','内窓清掃'];
const coating=['鉄粉除去','必要時粘土処理','再洗浄・すすぎ','水分除去','研磨・下地処理','研磨後清掃','ボディコーティング','コーティング拭き上げ・細部確認','最終検査'];
const courses={'TCPスタンダード洗車':wash,'TCPプレミアム洗車':[...interior,...wash,'タイヤワックス'],'TMDプレミアム洗車':[...interior,...wash,'タイヤワックス'],'コーティング施工':['車両・塗装状態確認','対象時の車内作業',...wash,...coating]};
const defaults={date:new Date().toLocaleDateString('sv-SE'),staff:'渡辺',course:'TCPスタンダード洗車',customer:'',car:'',plate:'',notes:'',tasks:{},reasons:{},marks:[],extra:[],wheelChemical:'未記録',dilution:'',ironCount:'未記録',acidReason:'',storage:'',vehicleCondition:''};
const key='tmdstore_v5_internal_dev';let data={...defaults};try{const old=JSON.parse(localStorage.getItem(key)||'{}');data={...data,...old,tasks:old.tasks||{},reasons:old.reasons||{},extra:old.extra||[],marks:old.marks||[]}}catch{}
let page=0,photos={before:[],during:[],after:[],paper:[]};let canvas;
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function save(){try{localStorage.setItem(key,JSON.stringify(data))}catch{}}
function fld(label,name,type='text'){return `<label for="${name}">${label}</label><input id="${name}" type="${type}" value="${esc(data[name])}" data-field="${name}">`}
function choose(label,name,options){return `<label for="${name}">${label}</label><select id="${name}" data-field="${name}">${options.map(x=>`<option value="${esc(x)}" ${data[name]===x?'selected':''}>${esc(x)}</option>`).join('')}</select>`}
function taskList(){return [...courses[data.course],...data.extra]}
function taskKey(t){return data.course+'|'+t}
function buildReport(){let rows=taskList().map((name,i)=>{let k=taskKey(name),status=data.tasks[k]||'未確認',reason=data.reasons[k]||'';return `<tr><td>${i+1}</td><td>${esc(name)}</td><td>${esc(status)}</td><td>${esc(reason)}</td></tr>`}).join('');document.getElementById('reportPaper').innerHTML=`<div class="report-title">TMDstore　作業報告書 <span style="font-size:9pt;font-weight:400">社内施工記録／Ver.5 開発版</span></div><div class="report-meta"><div><b>施工日：</b>${esc(data.date)}</div><div><b>担当者：</b>${esc(data.staff)}</div><div><b>お客様（仮名）：</b>${esc(data.customer||'―')}</div><div><b>車種：</b>${esc(data.car||'―')}</div><div><b>車両識別メモ：</b>${esc(data.plate||'―')}</div><div><b>施工コース：</b>${esc(data.course)}</div></div><div class="report-section">車両状態・施工条件</div><div style="font-size:9pt">保管状況：${esc(data.storage||'未記録')} ／ 車両状態：${esc(data.vehicleCondition||'未記録')}<br>ホイール・タイヤ洗浄剤：${esc(data.wheelChemical)} ／ 希釈：${esc(data.dilution||'未記録')}<br>酸性プレウォッシュ：${esc(data.acidReason||'標準工程')} ／ 鉄粉除去：${esc(data.ironCount)}</div><div class="report-section">施工工程・実施状況</div><table class="report-table"><thead><tr><th style="width:7%">No.</th><th style="width:43%">工程</th><th style="width:17%">状況</th><th>変更理由・備考</th></tr></thead><tbody>${rows}</tbody></table><div class="report-section">その他の所見</div><div class="report-notes">${esc(data.notes||'なし')}</div><div class="report-footer">社内用・開発版。写真／ボディチェック図は別管理。個人情報は入力しないこと。</div>`}
function render(){document.getElementById('progress').innerHTML=Array.from({length:5},(_,i)=>`<span class="${i<=page?'on':''}"></span>`).join('');document.getElementById('prev').disabled=page===0;document.getElementById('next').textContent=page===4?'最初へ':'次へ';let h='';
if(page===0){h=`<h2>1. 基本情報</h2>${fld('施工日','date','date')}${choose('担当者','staff',['渡辺','その他'])}${fld('お客様名（テスト用仮名）','customer')}${fld('車種','car')}${fld('車両識別メモ（架空データのみ）','plate')}${choose('施工コース','course',Object.keys(courses))}${fld('保管状況','storage')}${fld('車両状態・汚れの特徴','vehicleCondition')}<p class="hint">コースごとに工程が自動で切り替わります。</p>`}
else if(page===1){h=`<h2>2. ボディチェック</h2><p class="hint">車両図を指でなぞって傷・気になる箇所を記録できます。現段階ではPDFには含まれません。</p><canvas id="carCanvas" class="car" width="600" height="460"></canvas><button class="secondary" id="clearMarks" style="margin-top:8px;width:100%">記入を消去</button><div class="photo"><label>紙のボディチェック表（試験用写真）</label><input type="file" accept="image/*" multiple data-photo="paper"><div class="preview" id="pvpaper"></div></div>`}
else if(page===2){h=`<h2>3. 作業工程・施工条件</h2><p class="pill">${esc(data.course)}</p>${choose('ホイール・タイヤ洗浄剤','wheelChemical',['未記録','アルカリ原液','アルカリ20%','酸性原液','その他'])}${fld('希釈率・使用条件（補足）','dilution')}${choose('鉄粉除去回数','ironCount',['未記録','なし','1回','2回','3回以上'])}${fld('酸性プレウォッシュ変更理由（変更時）','acidReason')}<p class="hint">標準工程を表示しています。変更・未実施の場合は理由を記録してください。</p>${taskList().map((x,i)=>{let k=taskKey(x);return `<div class="task"><label>${i+1}. ${esc(x)}</label><select data-task="${esc(x)}">${['未確認','完了','変更して実施','未実施','対象外'].map(y=>`<option ${data.tasks[k]===y?'selected':''}>${y}</option>`).join('')}</select><input style="margin-top:6px;font-size:14px" placeholder="変更理由・備考（任意）" data-reason="${esc(x)}" value="${esc(data.reasons[k]||'')}"></div>`}).join('')}<label>追加工程</label><input id="extraName" placeholder="例：ガラス油膜除去"><button id="addExtra" type="button" style="width:100%;margin-top:8px">工程を追加</button>${data.extra.length?`<button class="secondary" id="removeExtra" style="width:100%;margin-top:8px">最後の追加工程を削除</button>`:''}`}
else if(page===3){h=`<h2>4. 写真・所見</h2>${[['before','施工前'],['during','施工中'],['after','施工後']].map(([id,name])=>`<div class="photo"><label>${name}（一時表示のみ）</label><input type="file" accept="image/*" multiple data-photo="${id}"><div class="preview" id="pv${id}"></div></div>`).join('')}<label>その他の所見</label><textarea data-field="notes">${esc(data.notes)}</textarea>`}
else{h=`<h2>5. 社内報告書プレビュー</h2><p class="hint">印刷時は下の確認画面ではなく、社内用A4報告書のみを出力します。</p><pre>【TMDstore 施工記録 Ver.5】\n施工日：${esc(data.date)}\n担当：${esc(data.staff)}\n車種：${esc(data.car)}\nコース：${esc(data.course)}\n\n【工程】\n${esc(taskList().map(t=>t+'：'+(data.tasks[taskKey(t)]||'未確認')+(data.reasons[taskKey(t)]?' ／ '+data.reasons[taskKey(t)]:'')).join('\n'))}\n\n【所見】\n${esc(data.notes||'なし')}\n\n【写真（一時保持）】\n施工前：${photos.before.length}枚／施工中：${photos.during.length}枚／施工後：${photos.after.length}枚\n紙チェック表：${photos.paper.length}枚</pre><button id="exportJSON" style="width:100%">施工記録JSONを保存</button><button id="printPDF" style="width:100%;margin-top:8px">A4社内報告書をPDF保存</button><p class="hint">写真はPDF・JSONに含まれません。Google Drive連携は未実装です。</p>`}
document.getElementById('screen').innerHTML=h;
document.querySelectorAll('[data-field]').forEach(el=>el.addEventListener('input',()=>{let old=data[el.dataset.field];data[el.dataset.field]=el.value;save();if(el.dataset.field==='course'&&old!==el.value)render()}));
document.querySelectorAll('[data-task]').forEach(el=>el.addEventListener('change',()=>{data.tasks[taskKey(el.dataset.task)]=el.value;save()}));document.querySelectorAll('[data-reason]').forEach(el=>el.addEventListener('input',()=>{data.reasons[taskKey(el.dataset.reason)]=el.value;save()}));
document.querySelectorAll('[data-photo]').forEach(el=>el.addEventListener('change',()=>{let id=el.dataset.photo;photos[id]=Array.from(el.files||[]);showPhotos(id)}));
if(page===1)setupCanvas();if(page===2){document.getElementById('addExtra').onclick=()=>{let val=document.getElementById('extraName').value.trim();if(!val)return;if(!taskList().includes(val))data.extra.push(val);save();render()};if(data.extra.length)document.getElementById('removeExtra').onclick=()=>{data.extra.pop();save();render()}}if(page===4){document.getElementById('exportJSON').onclick=()=>{downloadFile('TMDstore_施工記録_Ver5_テスト.json',JSON.stringify({version:'5-internal-dev',exportedAt:new Date().toISOString(),...data,photoCounts:Object.fromEntries(Object.entries(photos).map(([k,v])=>[k,v.length]))},null,2),'application/json')};document.getElementById('printPDF').onclick=()=>{buildReport();window.print()}}}
function downloadFile(name,content,type){let blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000)}
function showPhotos(id){let el=document.getElementById('pv'+id);if(!el)return;el.innerHTML='';photos[id].forEach(f=>{let img=document.createElement('img');img.src=URL.createObjectURL(f);img.onload=()=>URL.revokeObjectURL(img.src);el.appendChild(img)})}
function setupCanvas(){canvas=document.getElementById('carCanvas');let ctx=canvas.getContext('2d');function draw(){ctx.clearRect(0,0,600,460);ctx.strokeStyle='#5b7a93';ctx.lineWidth=5;ctx.beginPath();ctx.roundRect(175,45,250,370,65);ctx.stroke();ctx.strokeRect(205,120,190,85);ctx.strokeRect(205,245,190,95);ctx.fillStyle='#e1ebf2';ctx.fillRect(155,100,20,70);ctx.fillRect(425,100,20,70);ctx.fillRect(155,285,20,70);ctx.fillRect(425,285,20,70);ctx.fillStyle='#5b7a93';ctx.font='22px sans-serif';ctx.fillText('前',288,34);ctx.fillText('後',288,450);ctx.fillStyle='#d94343';data.marks.forEach(p=>{ctx.beginPath();ctx.arc(p.x,p.y,7,0,Math.PI*2);ctx.fill()})}draw();let drawing=false;function mark(e){let r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*600/r.width,y=(e.clientY-r.top)*460/r.height;data.marks.push({x,y});draw();save()}canvas.addEventListener('pointerdown',e=>{drawing=true;canvas.setPointerCapture(e.pointerId);mark(e)});canvas.addEventListener('pointermove',e=>{if(drawing)mark(e)});canvas.addEventListener('pointerup',()=>drawing=false);document.getElementById('clearMarks').onclick=()=>{data.marks=[];save();draw()}}
document.getElementById('prev').onclick=()=>{if(page>0)page--;render()};document.getElementById('next').onclick=()=>{page=page===4?0:page+1;render()};render();
</script></body></html>
