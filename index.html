<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>TMDstore 施工管理・試作版 Ver.2</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif;color:#172333;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}.wrap{max-width:640px;margin:auto;padding:16px 16px 95px}header{background:#102c46;color:white;padding:20px 16px}header h1{margin:0;font-size:21px}header small{color:#c8d8e6}.progress{display:flex;gap:5px;margin:16px 0}.progress span{height:6px;background:#dce5ee;flex:1;border-radius:5px}.progress .on{background:#137bb9}.panel{background:white;border-radius:16px;padding:20px;margin:12px 0;box-shadow:0 2px 9px #1723330b}h2{font-size:20px;margin:0 0 16px}label{display:block;font-size:14px;font-weight:700;margin:14px 0 5px}input,select,textarea{width:100%;font-size:17px;padding:12px;border:1px solid #b9c9d5;border-radius:9px;background:white}textarea{min-height:92px}.buttons{position:fixed;bottom:0;left:0;right:0;background:#fff;padding:12px;display:flex;gap:10px;box-shadow:0 -3px 16px #102c4622;justify-content:center}.buttons button{max-width:300px}button{border:0;border-radius:10px;padding:14px;font-size:16px;font-weight:700;background:#087ab9;color:white;cursor:pointer;flex:1}button.secondary{background:#e8eff5;color:#21455d}.hint{font-size:13px;color:#62778a}.task{padding:12px 0;border-bottom:1px solid #e4edf3}.task label{margin:0 0 8px}.task select{font-size:15px}.hide{display:none}.pill{display:inline-block;padding:5px 9px;border-radius:20px;background:#e8f3f9;color:#135b82;font-size:12px}.photo{padding:10px;border:1px dashed #aec2d1;border-radius:10px;margin:12px 0}.preview img{width:80px;height:80px;object-fit:cover;border-radius:8px;margin:4px}.car{border:1px solid #b9c9d5;border-radius:12px;width:100%;height:230px;touch-action:none;background:#f9fbfd}.warn{background:#fff7e7;border-radius:8px;padding:10px;font-size:13px;color:#705520}pre{white-space:pre-wrap;font-family:inherit;font-size:13px;line-height:1.7;background:#f3f6fa;padding:14px;border-radius:9px}a{color:#087ab9}</style></head><body><header><div style="max-width:640px;margin:auto"><h1>TMDstore 施工管理</h1><small>第2次試作版｜Safari等のブラウザで開いてください</small></div></header><main class="wrap"><div class="progress" id="progress"></div><section class="panel" id="screen"></section><div class="warn">試作版です。顧客の実名・電話番号などの個人情報は入力しないでください。写真は端末内に一時表示するのみで、Google Driveには送信されません。</div></main><nav class="buttons"><button class="secondary" id="prev">戻る</button><button id="next">次へ</button></nav><script>
const courses={"TCPスタンダード洗車":["車両状態・保管状況確認","ホイール・タイヤ洗浄","細部洗浄A（ドア回り）","アルカリプレウォッシュ","細部洗浄B（パネル継ぎ目）","すすぎ","酸性プレウォッシュ","すすぎ","中性シャンプー・コンタクトウォッシュ","純水すすぎ・仕上げ","拭き上げ・最終確認"],"TCPプレミアム洗車":["車内清掃（掃除機・拭き上げ）","内窓清掃","ホイール・タイヤ洗浄","細部洗浄A（ドア回り）","アルカリプレウォッシュ","細部洗浄B（パネル継ぎ目）","すすぎ","酸性プレウォッシュ","すすぎ","中性シャンプー・コンタクトウォッシュ","純水すすぎ・仕上げ","タイヤワックス","最終確認"],"TMDプレミアム洗車":["車内清掃（掃除機・拭き上げ）","内窓清掃","ホイール・タイヤ洗浄","細部洗浄A（ドア回り）","アルカリプレウォッシュ","細部洗浄B（パネル継ぎ目）","すすぎ","酸性プレウォッシュ","すすぎ","中性シャンプー・コンタクトウォッシュ","純水すすぎ・仕上げ","タイヤワックス","最終確認"],"コーティング施工":["車両・塗装状態確認","内装作業（対象時）","ホイール・タイヤ洗浄","細部洗浄A","アルカリプレウォッシュ・細部洗浄B","すすぎ","酸性プレウォッシュ・すすぎ","中性シャンプー・純水すすぎ","鉄粉除去","必要時粘土処理","研磨・下地処理","ボディコーティング","最終検査"]};
const key='tmdstore_demo_v1';let data={date:new Date().toISOString().slice(0,10),staff:'渡辺',course:'TCPスタンダード洗車',customer:'',car:'',plate:'',notes:'',tasks:{},marks:[]};try{data={...data,...JSON.parse(localStorage.getItem(key)||'{}')}}catch{}let page=0;let photos={before:[],during:[],after:[],paper:[]};let canvas;
function save(){try{localStorage.setItem(key,JSON.stringify(data))}catch{}}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function fld(label,name,type='text'){return `<label for="${name}">${label}</label><input id="${name}" type="${type}" value="${esc(data[name])}" data-field="${name}">`}
function render(){document.getElementById('progress').innerHTML=Array.from({length:5},(_,i)=>`<span class="${i<=page?'on':''}"></span>`).join('');document.getElementById('prev').disabled=page===0;document.getElementById('next').textContent=page===4?'最初へ':'次へ';let h='';if(page===0){h=`<h2>1. 基本情報</h2>${fld('施工日','date','date')}<label>担当者</label><select data-field="staff"><option ${data.staff==='渡辺'?'selected':''}>渡辺</option><option ${data.staff==='その他'?'selected':''}>その他</option></select>${fld('お客様名（試作では仮名）','customer')}${fld('車種','car')}${fld('車両識別メモ','plate')}<label>施工コース</label><select data-field="course">${Object.keys(courses).map(x=>`<option ${x===data.course?'selected':''}>${x}</option>`).join('')}</select><p class="hint">コースを変更すると次の画面の作業工程が切り替わります。</p>`}else if(page===1){h=`<h2>2. ボディチェック</h2><p class="hint">車両の模式図に指で傷・気になる箇所を記入できます。</p><canvas id="carCanvas" class="car" width="600" height="460"></canvas><button class="secondary" id="clearMarks" style="margin-top:8px;width:100%">記入を消去</button><div class="photo"><label>紙のチェック表を撮影・選択</label><input type="file" accept="image/*" capture="environment" multiple data-photo="paper"><div class="preview" id="pvpaper"></div></div>`}else if(page===2){h=`<h2>3. 作業工程チェック</h2><p class="pill">${esc(data.course)}</p><p class="hint">各工程の実施状況を選択してください。</p>${courses[data.course].map((x,i)=>`<div class="task"><label>${i+1}. ${esc(x)}</label><select data-task="${esc(x)}">${['未確認','完了','変更して実施','未実施'].map(y=>`<option ${data.tasks[data.course+'|'+x]===y?'selected':''}>${y}</option>`).join('')}</select></div>`).join('')}`}else if(page===3){h=`<h2>4. 施工写真・所見</h2>${[['before','施工前'],['during','施工中'],['after','施工後']].map(([id,name])=>`<div class="photo"><label>${name}の写真</label><input type="file" accept="image/*" multiple data-photo="${id}"><div class="preview" id="pv${id}"></div></div>`).join('')}<label>その他の所見</label><textarea data-field="notes">${esc(data.notes)}</textarea>`}else{let entries=courses[data.course].map(x=>`${x}：${data.tasks[data.course+'|'+x]||'未確認'}`).join('\n');h=`<h2>5. 報告書プレビュー</h2><p class="hint">入力した内容の確認用です。正式なVer.5 PDF出力は今後の実装対象です。</p><pre>【TMDstore 施工記録】\n施工日：${esc(data.date)}\n担当者：${esc(data.staff)}\nお客様：${esc(data.customer)}\n車種：${esc(data.car)}\nコース：${esc(data.course)}\n\n【作業工程】\n${esc(entries)}\n\n【所見】\n${esc(data.notes||'なし')}\n\n【写真枚数（この画面の一時保持）】\n施工前：${photos.before.length}枚／施工中：${photos.during.length}枚／施工後：${photos.after.length}枚\n紙チェック表：${photos.paper.length}枚</pre><button id="exportText" style="width:100%">確認用テキストを保存</button><p class="hint">車両図の記入はこの試作端末に一時保存されます。</p>`}document.getElementById('screen').innerHTML=h;document.querySelectorAll('[data-field]').forEach(el=>el.addEventListener('input',()=>{data[el.dataset.field]=el.value;save()}));document.querySelectorAll('[data-task]').forEach(el=>el.addEventListener('change',()=>{data.tasks[data.course+'|'+el.dataset.task]=el.value;save()}));document.querySelectorAll('[data-photo]').forEach(el=>el.addEventListener('change',()=>{let id=el.dataset.photo;photos[id]=Array.from(el.files||[]);showPhotos(id)}));if(page===1)setupCanvas();if(page===4)document.getElementById('exportText').onclick=()=>{let text=document.querySelector('pre').textContent;let blob=new Blob([text],{type:'text/plain;charset=utf-8'});let url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download='TMDstore_施工記録_確認用.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}}
function showPhotos(id){let el=document.getElementById('pv'+id);if(!el)return;el.innerHTML='';photos[id].forEach(f=>{let img=document.createElement('img');img.src=URL.createObjectURL(f);img.onload=()=>URL.revokeObjectURL(img.src);el.appendChild(img)})}function setupCanvas(){canvas=document.getElementById('carCanvas');let ctx=canvas.getContext('2d');function draw(){ctx.clearRect(0,0,600,460);ctx.strokeStyle='#5b7a93';ctx.lineWidth=5;ctx.beginPath();ctx.rect(175,45,250,370);ctx.stroke();ctx.strokeRect(205,120,190,85);ctx.strokeRect(205,245,190,95);ctx.fillStyle='#e1ebf2';ctx.fillRect(155,100,20,70);ctx.fillRect(425,100,20,70);ctx.fillRect(155,285,20,70);ctx.fillRect(425,285,20,70);ctx.fillStyle='#5b7a93';ctx.font='22px sans-serif';ctx.fillText('前',288,34);ctx.fillText('後',288,450);ctx.fillStyle='#d94343';data.marks.forEach(p=>{ctx.beginPath();ctx.arc(p.x,p.y,7,0,Math.PI*2);ctx.fill()})}draw();let drawing=false;function mark(e){let r=canvas.getBoundingClientRect();let x=(e.clientX-r.left)*600/r.width,y=(e.clientY-r.top)*460/r.height;data.marks.push({x,y});draw();save()}canvas.addEventListener('pointerdown',e=>{drawing=true;canvas.setPointerCapture(e.pointerId);mark(e)});canvas.addEventListener('pointermove',e=>{if(drawing)mark(e)});canvas.addEventListener('pointerup',()=>drawing=false);document.getElementById('clearMarks').onclick=()=>{data.marks=[];save();draw()}}
document.getElementById('prev').onclick=()=>{if(page>0)page--;render()};document.getElementById('next').onclick=()=>{page=page===4?0:page+1;render();window.scrollTo(0,0)};render();
</script></body></html>
